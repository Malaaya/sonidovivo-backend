spring.application.name=sonidovivo
server.port=8080

spring.datasource.url=jdbc:h2:mem:sonidovivo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.swagger-ui.path=/swagger-ui.html

jwt.secret=${JWT_SECRET:VGhpc0tleU11c3RCZUF0TGVhc3RUaGlydHlUaHJlZUJ5dGVzIQ==}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.seed-users.enabled=${SEED_USERS_ENABLED:false}
app.seed-users.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed-users.seller-password=${SEED_SELLER_PASSWORD:}
app.seed-users.customer-password=${SEED_CUSTOMER_PASSWORD:}